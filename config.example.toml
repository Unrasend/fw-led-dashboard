# Framework LED dashboard — safe defaults for one or two 9x34 LED Matrix modules.
brightness_percent = 40
# Frame-rate cap per panel; grayscale output tops out near 7 FPS in the panel firmware.
animation_fps = 10
# Each panel shows the other one's widgets. Only the starting value: "Swap panels" in the tray
# or the settings window changes it live and remembers the choice.
swap_panels = false

# USB identities from `framework-led-dashboard --list-panels`; the installer fills them in.
# With a single module one of the two stays empty (the installer uses [panels.left]).
[panels.left]
identity = ""

[panels.right]
identity = ""

[location]
# Explicit coordinates override IP geolocation. Uncomment both or neither.
# latitude = 50.0755
# longitude = 14.4378
ip_lookup_enabled = true
ip_lookup_ttl_seconds = 21600
vpn_interface_prefixes = ["tun", "tap", "wg", "tailscale", "nordlynx", "mullvad"]

[updates]
metrics_seconds = 1
weather_seconds = 900

[alerts]
# The CPU threshold is only the starting value: "Blink from" on the CPU temperature widget in
# the settings window changes it and remembers it. It stops blinking (critical - recovery)
# degrees lower, 5 °C here.
cpu_temperature_critical_c = 120
cpu_temperature_recovery_c = 115
# Bars blink by the rule each bar has in the settings window (CPU and RAM at or above 95 %,
# battery at or below 10 % unless you change them). The battery_*, ram_* and
# cpu_usage_critical_percent keys of older versions are still accepted and ignored.

# Disabled unless measured and explicitly configured.
# outside_temperature_min_c = -20
# outside_temperature_max_c = 38
